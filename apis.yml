name: VendorHawk
description: >-
  VendorHawk was a Seattle-based SaaS subscription and vendor management platform
  that helped IT and finance teams discover, track, renew, and optimize software
  spend across the organization. Founded in 2014 and backed by Techstars, VendorHawk
  was acquired by ServiceNow (NYSE NOW) in an all-cash transaction announced in
  April 2018 and folded into the ServiceNow platform. The vendorhawk.co domain now
  301-redirects to servicenow.com, and the product has no independent public API,
  developer portal, or artifact surface of its own.
